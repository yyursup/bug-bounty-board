name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live programs
        # If the platforms can't be reached, the last committed programs.json is deployed unchanged.
        continue-on-error: true
        run: python3 scripts/fetch_bounties.py site/programs.json

      - name: Commit refreshed data
        run: |
          if ! git diff --quiet -- site/programs.json; then
            git config user.name "bounty-board-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/programs.json
            git commit -m "data: refresh programs.json"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
